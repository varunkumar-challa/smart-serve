<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="navigation-bar">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <img src="assets/smartlogo.png" alt="Logo" width="50" height="50">
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        
                        <div class="d-flex w-100">
                            <ul class="navbar-nav mr-auto">
                                <li class="nav-item active">
                                  <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
                                </li>
                                <li class="nav-item">
                                  <a class="nav-link" href="#">Link</a>
                                </li>
                                <li class="nav-item dropdown">
                                  <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    Dropdown
                                  </a>
                                  <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                                    <a class="dropdown-item" href="#">Action</a>
                                    <a class="dropdown-item" href="#">Another action</a>
                                    <div class="dropdown-divider"></div>
                                    <a class="dropdown-item" href="#">Something else here</a>
                                  </div>
                                </li>
                                <li class="nav-item">
                                  <a class="nav-link disabled" href="#">Disabled</a>
                                </li>
                              </ul>
                            <form class="d-flex w-100">
                                <input class="form-control me-1" type="search" placeholder="Order from Smart Groc for More Discounts" aria-label="Search">
                                <button class="btn btn-outline-success" type="submit">Search</button>
                            </form>
                        </div>
                    </div>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link me-1" href="cart.html" id="cartSummary">
                                <i class="bi bi-cart"></i> Cart (<span id="cartCount">0</span>)
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-1" href="#" id="totalBill">Total: ₹<span id="cartTotal">0</span></a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4" id="productContainer"></div>
    </div>
    <script>
      const products = [
          { id: 1, name: "Apple", imgSrc: "assets/apple.png",  originalPrice: 120, finalPrice: 96 },
          { id: 2, name: "Banana", imgSrc: "assets/banana.png", originalPrice: 60, finalPrice: 54 },
          { id: 3, name: "Orange", imgSrc: "assets/orange.png",  originalPrice: 80, finalPrice: 60 },
          { id: 4, name: "Grapes", imgSrc: "assets/grapes.png", originalPrice: 200, finalPrice: 140 },
          { id: 5, name: "Mango", imgSrc: "assets/mango.png", originalPrice: 150,  finalPrice: 128 },
          { id: 6, name: "Carrot", imgSrc: "assets/carrot.png", originalPrice: 50, finalPrice: 45 },
          { id: 7, name: "Tomato", imgSrc: "assets/tomato.png",originalPrice: 40,  finalPrice: 38 },
          { id: 8, name: "Potato", imgSrc: "assets/potato.png", originalPrice: 80,  finalPrice: 64 },
          { id: 9, name: "Onion", imgSrc: "assets/onion.png", originalPrice: 60, finalPrice: 54 },
          { id: 10, name: "Broccoli", imgSrc: "assets/broccoli.png", originalPrice: 120,  finalPrice: 90 },
          { id: 11, name: "Apple", imgSrc: "assets/apple.png",  originalPrice: 120, finalPrice: 96 },
          { id: 12, name: "Banana", imgSrc: "assets/banana.png",  originalPrice: 60,  finalPrice: 54 },
          { id: 13, name: "Orange", imgSrc: "assets/orange.png", originalPrice: 80, finalPrice: 60 },
          { id: 14, name: "Grapes", imgSrc: "assets/grapes.png",  originalPrice: 200,  finalPrice: 140 },
          { id: 15, name: "Mango", imgSrc: "assets/mango.png",  originalPrice: 150, finalPrice: 128 },
          { id: 16, name: "Carrot", imgSrc: "assets/carrot.png",  originalPrice: 50,  finalPrice: 45 },
          { id: 17, name: "Tomato", imgSrc: "assets/tomato.png", originalPrice: 40,  finalPrice: 38 },
          { id: 18, name: "Potato", imgSrc: "assets/potato.png",  originalPrice: 80,  finalPrice: 64 },
          { id: 19, name: "Onion", imgSrc: "assets/onion.png",  originalPrice: 60, finalPrice: 54 },
          { id: 20, name: "Broccoli", imgSrc: "assets/broccoli.png",originalPrice: 120, finalPrice: 90 },
          // Add up to 50 items as needed
      ];

      const cart = {};

function updateCart() {
    const cartCount = Object.keys(cart).reduce((sum, id) => sum + cart[id].quantity, 0);
    const cartTotal = Object.keys(cart).reduce((sum, id) => sum + cart[id].quantity * cart[id].finalPrice, 0);

    document.getElementById("cartCount").innerText = cartCount;
    document.getElementById("cartTotal").innerText = cartTotal.toFixed(2);
}

function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    if (!cart[productId]) {
        cart[productId] = { ...product, quantity: 0 };
    }
    cart[productId].quantity += 1;
    updateCart();
}

document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("productContainer");

    products.forEach(product => {
        const card = `
            <div class="col">
                <div class="card h-100">
                    <img src="${product.imgSrc}" class="card-img-top" alt="${product.name}">
                    <div class="card-body text-center">
                        <h5 class="card-title">${product.name}</h5>
                                <p>${product.quantity}</p>
                                <h5>₹${product.originalPrice}</h5>
                                <h5>₹${product.finalPrice}</h5>
                                <button class="btn btn-outline-danger" onclick="addToCart(${product.id})">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
